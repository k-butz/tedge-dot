# Broker config for the host-networked stacks (canbus, canopen): no `listener` line, so the
# port comes from the `-p` flag in the service's compose `command`. The SocketCAN connectors
# need the host's network namespace to see vcan0, so they reach the broker over the host
# loopback on a protocol-specific port instead of a published container port.
#
# NOTE: mosquitto 2.x binds its DEFAULT listener to localhost only. That is exactly right here
# (everything shares the host's loopback), but it means this file must not be used for a
# bridged service with a published port — connections through docker's port forwarding arrive
# on another interface and are closed. Those stacks use mosquitto.conf, which sets `listener`.
allow_anonymous true
