# End-to-end harness for the Rust OPC-UA connector.
#
#   broker     - lightweight MQTT broker (no cloud)
#   simulator  - python-asyncua OPC-UA server (a real OPC-UA TCP server)
#   connector  - the Rust tedge-dot (opcua module) reading the simulator
#
# The Robot suite runs on the host and connects to the broker on localhost:12883.
services:
  broker:
    image: public.ecr.aws/docker/library/eclipse-mosquitto:2
    volumes:
      - ../_shared/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      # Host port 12883 avoids clashing with a local tedge broker (1883) and the
      # modbus e2e harness (11883).
      - "12883:1883"

  simulator:
    build:
      context: ../..
      dockerfile: connectors/opcua/sim/Dockerfile
    environment:
      # Advertise the docker service hostname so the client's endpoint matches.
      OPCUA_ENDPOINT_HOST: simulator
    ports:
      - "4840:4840"

  connector:
    build:
      context: ../..
      dockerfile: connectors/opcua/Dockerfile.connector
    depends_on:
      - broker
      - simulator

  # thin-edge flows engine (user-defined mapper, no cloud) running this repo's flows against
  # the same broker, so the suite can drive the device-side command/parameter bridge end to end.
  flows:
    build:
      context: ../..
      dockerfile: connectors/_shared/Dockerfile.flows
      args:
        PROTOCOL: opcua
    depends_on:
      broker:
        condition: service_started
