# Long configured strings, so the parity check pins that neither build truncates (nor
# overflows) where the other does not. The device `type` is concatenated into every derived
# set name, and the rendered DTM title is derived from that name.
[connector]
protocol = "modbus"

[[device]]
name             = "plc-long"
type             = "ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab-ab"
protocol_address = { transport = "tcp", host = "127.0.0.1", port = 502, unit_id = 1 }

  [[device.point]]
  id          = "p1"
  datatype    = "uint16"
  access      = "read_write"
  unit        = "degC"
  description = ""
  address     = { table = "holding", address = 1, count = 1 }
