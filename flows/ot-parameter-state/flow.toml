# ot-parameter-state: connector samples + write results -> device twin (parameter sets)
#
# Maintains one twin fragment per parameter set (te/device/<device>///twin/<set>) holding the
# current value of every parameter (writable point) of the device, so a cloud UI such as
# Cumulocity's device "Parameters" tab shows the live state.
input.mqtt.topics = [
  "te/+/+/ot/+/sample/+",
  "te/+/+/ot/+/cmd/write/+",
  "te/+/+/ot/+/cmd/write-batch/+",
  # Retained, and published before the first sample: where the device type comes from for a
  # device whose parameters are all write-only (those points never produce a sample).
  "te/+/+/ot/+/status/link",
]

[config]
# One parameter set for every point that does not name an absolute one, instead of the derived
# "<device type, else protocol>_<group>_parameters". Empty -> derive.
default_set = "${params.default_set}"

[[steps]]
script = "main.js"
