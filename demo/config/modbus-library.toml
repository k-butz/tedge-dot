# Demo Modbus config that gets its points from a POINT LIBRARY instead of
# inlining them (contract §3.4) — the same simulator and the same points as
# modbus.toml next to it, so the two are directly comparable.
#
# The value of this shape: every instance of a device type shares one point
# list, and an instance declares only what is actually per-instance — its
# address. Adding the twentieth identical meter is three lines, and a discovery
# mechanism (mDNS, a scan, an asset inventory) can publish a `define-device`
# command that names a library rather than shipping 200 point definitions.
#
# Run it from an installed package:
#
#   cp /usr/share/tedge-dot/demo/modbus-library.toml /etc/tedge/plugins/ot/
#   sudo systemctl restart tedge-dot
#
# ...or from a source checkout, where the library is not in the packaged
# location yet, so point the search path at it:
#
#   just sim modbus
#   TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d \
#     cargo run --manifest-path impl/rust/Cargo.toml -- read -c demo/config/modbus-library.toml

[connector]
protocol      = "modbus"
service_name  = "tedge-dot-modbus"
poll_interval = "2s"
log_level     = "info"

# Where bare library names are looked up. Shown with its default; uncomment to
# override (relative entries resolve against this file's directory).
# point_library_path = ["/etc/tedge/plugins/ot/points.d", "/usr/share/tedge-dot/points.d"]

[mqtt]
host = "127.0.0.1"
port = 1883

# Two instances of one device type. `plc1` points at the demo simulator; `plc2`
# is what a second, identical meter costs — an address, and nothing else.
# (It stays disconnected in the demo: nothing is listening on 5021.)
[[device]]
name             = "plc1"
protocol_address = { transport = "tcp", host = "127.0.0.1", port = 5020, unit_id = 1 }
points_from      = ["pymodbus-demo"]

[[device]]
name             = "plc2"
protocol_address = { transport = "tcp", host = "127.0.0.1", port = 5021, unit_id = 1 }
points_from      = ["pymodbus-demo"]

  # An instance may still extend or adjust the list it references, without
  # touching the packaged file: an override names the point id and only the
  # fields it changes (`meta` and `transform` merge key by key, everything else
  # replaces).
  [[device.point]]
  id   = "level_f32"
  unit = "m"

  # Relabelling an inherited point takes one field: the library's description
  # and everything else it declared stay as they are.
  [[device.point]]
  id   = "temp_scaled"
  name = "Flow temperature (north wing)"

  [[device.point]]
  id       = "site_extra"
  datatype = "uint16"
  address  = { table = "holding", address = 8, count = 1 }
