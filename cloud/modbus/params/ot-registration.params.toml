# Registration flow params for the c8y e2e harness.
# Registers OT devices as modbus child devices, advertises the ot_write / ot_write_coil /
# parameter_update command capabilities (so c8y_SetRegister / c8y_SetCoil / c8y_ParameterUpdate
# are routed), and publishes the connector's device
# descriptor as
# the c8y_ModbusDevice digital-twin fragment (parity with the legacy plugin).
# Fallback only: the connector reports the device type its config declares (§3.1) on the link
# status, and the flow prefers that.
device_type = "modbus-device"
command_capabilities = "ot_write,ot_write_coil,parameter_update"
twin_fragment = "c8y_ModbusDevice"
