# Full Cumulocity end-to-end stack for the Rust OT connector.
#
#   tedge      - thin-edge.io demo image + connector + flows + operation shims
#   simulator  - the pymodbus Modbus TCP server (shared with the MQTT-only e2e)
#
# The stack is started by the Robot suite itself (DeviceLibrary, see
# cloud/_shared/device.resource): every setup creates its own compose project with a random
# name and a random DEVICE_ID, which the suite bootstraps with the image's bootstrap.sh and
# deletes from the tenant again at teardown. Nothing has to be started beforehand.
#
# The tedge container registers with Cumulocity using C8Y_* env + DEVICE_ID, then runs the
# c8y mapper, the connector service, and the deployed flows. The Robot suite drives Cumulocity.
services:
  tedge:
    build:
      context: ../..
      dockerfile: cloud/modbus/Dockerfile.tedge
    privileged: true
    labels:
      # The service DeviceLibrary treats as the device under test, so `Execute Command` runs
      # inside the tedge container (the simulator is addressable as "${SERIAL}:simulator").
      device-test-core.role: main
    environment:
      - C8Y_BASEURL=${C8Y_BASEURL:-}
      - C8Y_USER=${C8Y_USER:-}
      - C8Y_PASSWORD=${C8Y_PASSWORD:-}
      - DEVICE_ID=${DEVICE_ID:-}
    depends_on:
      simulator:
        condition: service_healthy

  simulator:
    build:
      context: ../..
      dockerfile: connectors/modbus/sim/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
